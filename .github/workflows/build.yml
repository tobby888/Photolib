name: Build

on:
  push:
    branches: [master]
    # 推 v* tag 时同样跑完整流水线，通过后由 release job 发布 Release。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# runner 的时区保持默认（UTC），不与开发机/生产的 Asia/Shanghai 对齐：应用自己把时区
# 写死在配置里（recruitmentClock、Jackson time-zone、@Scheduled 的 zone、MySQL
# serverTimezone），测试因此也不该依赖宿主时区，让 CI 跑在另一个时区正好能把这类假设暴露出来。
env:
  # 与 backend/pom.xml 的 node.version 对齐，保证 CI 与打包用的是同一个 Node。
  BUILD_NODE_VERSION: 20.19.4
  # README「环境要求」要求 Zig 0.16.x；校验值取自 https://ziglang.org/download/index.json。
  ZIG_VERSION: 0.16.0
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  # 原生组件构建用的 ninja / nasm 不走 apt（见「安装原生构建工具链」）。
  # ninja 校验值取自 GitHub Release 资产的 digest；nasm.us 不发布校验文件，取自首次下载的 tarball。
  NINJA_VERSION: 1.13.2
  NINJA_SHA256: 5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6
  NASM_VERSION: 2.16.03
  NASM_SHA256: 1412a1c760bbd05db026b6c0d1657affd6631cd0a63cddb6f73cc6d4aa616148

jobs:
  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BUILD_NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      # tsc -b && vite build，等价于前端的「类型检查 + 构建」。
      - run: npm run build

      # 前端单测用 node --experimental-strip-types 直接跑 .ts 源码，需要 Node 22+；
      # 打包所用的 Node 20 不支持该开关，所以只在这一步临时切换版本。
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - run: npm test

  mcp:
    name: MCP 服务检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 安装依赖
        working-directory: mcp
        run: pip install -e ".[dev]"

      # 测试全部用 httpx.MockTransport 打桩，不连任何真实后端，也不碰本机凭据文件。
      - name: 运行测试
        working-directory: mcp
        run: pytest -q

  package:
    name: 打包 JAR
    runs-on: ubuntu-latest
    # 原生组件要现编译 libjpeg-turbo + zig 包装层（Windows/Linux 两个目标），
    # 再加上前端构建和后端测试，冷缓存时耗时较长。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # frontend-maven-plugin 会自行下载隔离的 Node/npm，这里只缓存 ~/.npm，
      # 让 pom 里的 `npm ci` 不必每次都走网络。
      - name: 缓存 npm 下载
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # ninja / nasm 不再用 apt 装：runner 的 Ubuntu 软件源（azure.archive.ubuntu.com）会整段时间
      # 解析不了，PR #192 连着两次红在这里，重试半小时也没恢复。改成从官方发布包安装并缓存：
      # ninja 用 GitHub Release 的预编译版，nasm 从 nasm.us 的源码包编译（几十秒），都校验 sha256。
      - name: 缓存原生构建工具
        uses: actions/cache@v6
        with:
          path: ~/.local/native-tools
          key: native-tools-${{ runner.os }}-ninja-${{ env.NINJA_VERSION }}-nasm-${{ env.NASM_VERSION }}

      - name: 安装原生构建工具链
        run: |
          set -euo pipefail
          dir="$HOME/.local/native-tools"
          if [ ! -x "$dir/ninja" ] || [ ! -x "$dir/nasm" ]; then
            mkdir -p "$dir"
            curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/ninja.zip" \
              "https://github.com/ninja-build/ninja/releases/download/v$NINJA_VERSION/ninja-linux.zip"
            echo "$NINJA_SHA256  $RUNNER_TEMP/ninja.zip" | sha256sum -c -
            unzip -o -q "$RUNNER_TEMP/ninja.zip" ninja -d "$dir"
            curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/nasm.tar.xz" \
              "https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/nasm-$NASM_VERSION.tar.xz"
            echo "$NASM_SHA256  $RUNNER_TEMP/nasm.tar.xz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/nasm-src"
            tar -xJf "$RUNNER_TEMP/nasm.tar.xz" -C "$RUNNER_TEMP/nasm-src" --strip-components=1
            (cd "$RUNNER_TEMP/nasm-src" && ./configure --quiet && make -j"$(nproc)" nasm)
            install -m 755 "$RUNNER_TEMP/nasm-src/nasm" "$dir/nasm"
          fi
          echo "$dir" >> "$GITHUB_PATH"

      - name: 缓存 Zig
        uses: actions/cache@v6
        with:
          path: ~/.local/zig
          key: zig-${{ runner.os }}-${{ env.ZIG_VERSION }}

      - name: 安装 Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.local/zig/zig" ]; then
            mkdir -p "$HOME/.local/zig"
            curl -fsSL --retry 5 --retry-all-errors \
              -o "$RUNNER_TEMP/zig.tar.xz" \
              "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
            echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME/.local/zig" --strip-components=1
          fi
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"

      - name: 校验工具链
        run: |
          zig version
          cmake --version | head -n 1
          ninja --version
          nasm -v

      # clean package 会顺带跑后端测试（H2 内存库，不连 MySQL/OSS）、
      # 构建 React 前端并写入 JAR 的 static 目录、编译两套原生图片组件。
      - name: 构建并测试
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress clean package

      - name: 校验 JAR 内容
        run: |
          set -euo pipefail
          jar=$(ls backend/target/photolib-backend-*.jar)
          echo "jar: $jar"
          for entry in \
            BOOT-INF/classes/static/index.html \
            BOOT-INF/classes/native/linux-x86_64/libphotolib-image.so \
            BOOT-INF/classes/native/windows-x86_64/photolib-image.dll; do
            unzip -l "$jar" "$entry" | grep -q "$entry" || {
              echo "JAR 缺少 $entry" >&2
              exit 1
            }
          done

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传 JAR
        uses: actions/upload-artifact@v7
        with:
          name: photolib-backend-jar
          path: backend/target/photolib-backend-*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 Release
    # 两个 job 都要过：package 保证附件来自跑通后端测试和产物校验的那次构建，
    # frontend 覆盖 lint 与前端单测（package 里的 Maven 只构建前端、不跑这两项）。
    # 非 tag 的推送里这个 job 不会执行。
    needs: [frontend, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 下载打包产物
        uses: actions/download-artifact@v8
        with:
          name: photolib-backend-jar
          path: release

      # JAR 里的版本号来自 pom（0.1.0-SNAPSHOT），与 tag 无关。附件按 tag 改名，
      # 下载的人才能一眼看出对应哪个版本；JAR 内容本身不变。
      - name: 按 tag 命名附件
        run: |
          set -euo pipefail
          jar=$(ls release/photolib-backend-*.jar)
          mv "$jar" "release/photolib-backend-$GITHUB_REF_NAME.jar"
          ls -l release

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 带连字符的 tag（v1.2.0-rc.1 之类）按预发布处理。
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            "release/photolib-backend-$GITHUB_REF_NAME.jar"

  deploy:
    name: 部署到生产
    # 只有 master 上的推送（或在 master 上手动触发）才部署；PR 和 v* tag 不部署。
    # 直接用 package job 上传的 JAR，不重新构建，保证上线的就是跑过测试和产物校验的那一个。
    needs: [frontend, package]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ${{ vars.PHOTOLIB_DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 65  # 等待中转机完成接收、SSH 上传和重启
    # 部署串行执行，且不取消正在进行的部署，避免半途停服。
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: 下载打包产物
        uses: actions/download-artifact@v8
        with:
          name: photolib-backend-jar
          path: dist-jar

      - name: 通过中转机部署 JAR
        shell: bash
        env:
          PHOTOLIB_DEPLOY_URL: ${{ vars.PHOTOLIB_DEPLOY_URL }}
          PHOTOLIB_DEPLOY_TOKEN: ${{ secrets.PHOTOLIB_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          : "${PHOTOLIB_DEPLOY_URL:?请设置 Actions 变量 PHOTOLIB_DEPLOY_URL}"
          : "${PHOTOLIB_DEPLOY_TOKEN:?请设置 Actions Secret PHOTOLIB_DEPLOY_TOKEN}"
          shopt -s nullglob
          jars=(dist-jar/photolib-backend-*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "::error::期望恰好一个 PhotoLib JAR"
            exit 1
          fi
          jar="${jars[0]}"
          digest=$(sha256sum < "$jar")
          digest="${digest%% *}"
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT

          # 中转机完成重启后才返回 200，避免 HTTP 自动重试重复触发重启。
          status=$(curl --silent --show-error --proto '=https' \
            --connect-timeout 20 --max-time 3600 \
            --request POST --upload-file "$jar" \
            --header @- \
            --header 'Content-Type: application/java-archive' \
            --header 'Expect: 100-continue' \
            --header "X-Artifact-Name: ${jar##*/}" \
            --header "X-Artifact-SHA256: $digest" \
            --header "X-Deploy-Run-ID: $GITHUB_RUN_ID" \
            --output "$response" --write-out '%{http_code}' \
            "${PHOTOLIB_DEPLOY_URL%/}/v1/deploy/photolib" \
            <<< "Authorization: Bearer $PHOTOLIB_DEPLOY_TOKEN")
          cat "$response"
          if [[ "$status" != 200 ]]; then
            echo "::error::中转部署失败，HTTP $status（run ID $GITHUB_RUN_ID）"
            exit 1
          fi
