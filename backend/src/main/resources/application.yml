server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: photolib-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/photolib?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 1536MB
      max-request-size: 1536MB

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      base-path: /api/v1/actuator
      exposure:
        include: health,info

photolib:
  preview-bootstrap-retry-delay: ${PREVIEW_BOOTSTRAP_RETRY_DELAY:30s}
  startup-missing-object-cleanup:
    enabled: ${STARTUP_MISSING_OBJECT_CLEANUP_ENABLED:true}
    max-ratio: ${STARTUP_MISSING_OBJECT_CLEANUP_MAX_RATIO:0.2}
    min-absolute: ${STARTUP_MISSING_OBJECT_CLEANUP_MIN_ABSOLUTE:20}
  backup:
    # 每天凌晨 0 点（Asia/Shanghai）自动把整库业务数据备份到对象存储。
    enabled: ${DATABASE_BACKUP_ENABLED:true}
    cron: ${DATABASE_BACKUP_CRON:0 0 0 * * *}
    retention: ${DATABASE_BACKUP_RETENTION:30d}
    minimum-retained: ${DATABASE_BACKUP_MINIMUM_RETAINED:7}
    # 管理员导入备份文件时的体积上限。压缩后的上限与 EndpointUploadLimitFilter 里的
    # 请求体上限对应，解压后的上限用于挡住压缩炸弹。
    max-upload-bytes: ${DATABASE_BACKUP_MAX_UPLOAD_BYTES:512MB}
    max-decompressed-bytes: ${DATABASE_BACKUP_MAX_DECOMPRESSED_BYTES:2GB}
  message-image-cleanup:
    # 每天凌晨收走上传超过宽限期、却没被任何管理消息或反馈引用的消息图片（行 + 对象）。
    # 宽限期留给还在编辑框里没发出去的图。
    enabled: ${MESSAGE_IMAGE_CLEANUP_ENABLED:true}
    grace-days: ${MESSAGE_IMAGE_CLEANUP_GRACE_DAYS:7}
  photo-processing:
    threads: ${PHOTO_PROCESSING_THREADS:1}
    temporary-directory: ${PHOTO_PROCESSING_TEMPORARY_DIRECTORY:./data/photo-processing}
  photo:
    missing-upload-scan:
      # 定时扫描停在「上传中」、但原图在对象存储里确认不存在的照片记录，把它们软删掉。
      # 这类记录会一直挡住同一张图的重传（查重按 sha256 + deleted=0）。
      # 关掉它只会让那些记录继续积着，不影响上传本身。
      enabled: ${MISSING_UPLOAD_SCAN_ENABLED:true}
      delay-ms: ${MISSING_UPLOAD_SCAN_DELAY_MS:900000}
      initial-delay-ms: ${MISSING_UPLOAD_SCAN_INITIAL_DELAY_MS:300000}
    failed-upload-retention:
      # 处理失败（停在「上传中」且带着失败原因）、原图却还在桶里的记录，超过保留期没人重试
      # 就软删并删掉它的原图。那张图从没进过图库；保留期就是留给上传者重试的时间。
      enabled: ${FAILED_UPLOAD_RETENTION_ENABLED:true}
      retention-days: ${FAILED_UPLOAD_RETENTION_DAYS:7}
      delay-ms: ${FAILED_UPLOAD_RETENTION_DELAY_MS:3600000}
      initial-delay-ms: ${FAILED_UPLOAD_RETENTION_INITIAL_DELAY_MS:600000}
    stalled-processing:
      # 停在「处理中」、本进程却没有任务在处理的照片（JVM 重启、执行器拒收、处理中出现 Error）。
      # 重提交次数没到上限就重新提交，到了上限就标为处理失败。次数落库（Flyway V53），
      # 防止一张会把 JVM 带走的图让服务每次重启都再崩一次。
      enabled: ${STALLED_PROCESSING_RECOVERY_ENABLED:true}
      stale-after-minutes: ${STALLED_PROCESSING_STALE_AFTER_MINUTES:15}
      max-resubmits: ${STALLED_PROCESSING_MAX_RESUBMITS:1}
      delay-ms: ${STALLED_PROCESSING_DELAY_MS:300000}
      initial-delay-ms: ${STALLED_PROCESSING_INITIAL_DELAY_MS:300000}
  auth:
    access-ttl: 15m
    idle-ttl: 30m
    secure-cookie: ${AUTH_SECURE_COOKIE:true}
    login-throttle:
      # 单个账号连续失败多少次后锁定
      max-identifier-failures: ${LOGIN_MAX_IDENTIFIER_FAILURES:5}
      # 单个客户端地址累计失败多少次后锁定。校区可能整体走同一个出口 IP，
      # 所以要明显高于账号阈值，避免几个人打错字就把整栋楼锁在外面。
      max-address-failures: ${LOGIN_MAX_ADDRESS_FAILURES:40}
      failure-window: ${LOGIN_FAILURE_WINDOW:15m}
      lock-duration: ${LOGIN_LOCK_DURATION:15m}
    mfa:
      # 加密验证器 App 密钥的 AES 密钥，Base64 编码的 32 字节随机数（openssl rand -base64 32）。
      # 没配置时不能绑定验证器 App，也不能打开全站两步验证。一旦启用就不要更换：
      # 换了之后所有人的验证器都要重新绑定。请和数据库备份分开保管，但一样要备份。
      encryption-key: ${MFA_ENCRYPTION_KEY:}
      # 安全密钥 / 通行密钥（WebAuthn）绑定在站点域名上。生产环境务必显式配置，
      # 例如 MFA_WEBAUTHN_RP_ID=photowarehouse.cn、MFA_WEBAUTHN_ORIGINS=https://photowarehouse.cn
      rp-id: ${MFA_WEBAUTHN_RP_ID:}
      rp-name: ${MFA_WEBAUTHN_RP_NAME:PhotoLib}
      origins: ${MFA_WEBAUTHN_ORIGINS:}
      trusted-device-ttl: ${MFA_TRUSTED_DEVICE_TTL:30d}
      step-up-ttl: ${MFA_STEP_UP_TTL:15m}
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_INITIAL_PASSWORD:}
    admin-display-name: ${ADMIN_DISPLAY_NAME:系统管理员}
  storage:
    mode: ${STORAGE_MODE:oss}
    bucket: ${OSS_BUCKET:}
    endpoint: ${OSS_ENDPOINT:}
    public-endpoint: ${OSS_PUBLIC_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    local-directory: ${LOCAL_STORAGE_DIRECTORY:./data/object-storage}
    public-base-url: ${LOCAL_STORAGE_PUBLIC_BASE_URL:http://localhost:${SERVER_PORT:8080}/api/v1/local-storage/objects}
    signing-secret: ${LOCAL_STORAGE_SIGNING_SECRET:photolib-local-development-secret}
    cors-allowed-origins: ${OSS_CORS_ALLOWED_ORIGINS:*}
    upload-url-ttl: 15m
    download-url-ttl: 15m
    signature-window: ${OSS_SIGNATURE_WINDOW:5m}
    original-retention: 30d
    image-target-bytes: 10485760
    image-max-bytes: 104857600
    preview-compression-ratio: ${PREVIEW_COMPRESSION_RATIO:0.6}
  wecom:
    # 企业微信自建应用。corp-id 在"我的企业"页，agent-id / secret 在该自建应用的详情页。
    # 三者缺一，通知就只落站内信、外发记 FAILED 并告警。
    corp-id: ${WECOM_CORP_ID:}
    agent-id: ${WECOM_AGENT_ID:}
    secret: ${WECOM_SECRET:}
    # 消息里跳转链接的站点地址（不含路径），留空则消息只有正文没有链接。
    # 不写协议头时按 https 补全。
    site-base-url: ${WECOM_SITE_BASE_URL:}
    # markdown（默认）标题加粗链接都能渲染，但只有企业微信客户端支持；如果有成员在
    # 微信里通过企业微信插件收消息，改成 text 全局退回纯文本。
    message-type: ${WECOM_MESSAGE_TYPE:markdown}
    base-url: ${WECOM_BASE_URL:https://qyapi.weixin.qq.com}
    # access_token 名义有效期 7200s，提前这么久续期，避开"本地没过期、服务端已过期"的窗口。
    token-refresh-ahead: ${WECOM_TOKEN_REFRESH_AHEAD:5m}
    connect-timeout: ${WECOM_CONNECT_TIMEOUT:5s}
    read-timeout: ${WECOM_READ_TIMEOUT:10s}
  # V38 起通知外发改走企业微信；DirectMail 仅用于重试 V38 之前遗留的邮件投递记录。
  direct-mail:
    region-id: ${DIRECTMAIL_REGION_ID:cn-hangzhou}
    account-name: ${DIRECTMAIL_ACCOUNT_NAME:}
    access-key-id: ${DIRECTMAIL_ACCESS_KEY_ID:}
    access-key-secret: ${DIRECTMAIL_ACCESS_KEY_SECRET:}
  migration:
    enabled: ${IS_MIGRATE:false}
    database-url: ${OLD_DATABASE_URL:${LEGACY_DATABASE_URL:}}
    database-username: ${OLD_DB_USERNAME:}
    database-password: ${OLD_DB_PASSWORD:}
