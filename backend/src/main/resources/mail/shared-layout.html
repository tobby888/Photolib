<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{siteName}}</title>
</head>
<body style="margin:0;padding:0;background:#eef2f6;-webkit-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eef2f6;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" width="680" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:680px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;color:#1f2d3d;">
        <tr>
          <td style="padding:0 4px 16px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="vertical-align:middle;">{{logo}}</td>
                <td style="vertical-align:middle;padding-left:12px;">
                  <div style="font-size:18px;font-weight:700;color:#1f3b57;line-height:1.3;">{{siteName}}</div>
                  <div style="font-size:12px;color:#7a8a9c;margin-top:2px;">{{siteSlogan}}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        {{content}}
        <tr>
          <td align="center" style="padding:18px 8px 0;font-size:12px;color:#97a5b3;line-height:1.9;">
            此邮件由 {{siteName}} 自动生成，请勿直接回复。
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
