<tr>
  <td style="background:#fff;border:1px solid #e3e9f0;border-radius:14px;overflow:hidden;">
    <div style="padding:22px 28px;background:#4682B4;color:#fff;font-size:22px;font-weight:700;">工时申报成功 · 待审核</div>
    <div style="padding:24px 28px;font-size:14px;line-height:1.8;overflow-wrap:anywhere;word-break:break-word;">
      <p style="margin:0 0 12px;">{{recipientName}}，你好！系统收到一条通过上传链接、以你的姓名申报的工时，尚待审核。</p>
      <p>选题项目：{{projectTitle}}<br>
        工作日期：{{workDate}}<br>
        申报时长：拍摄 {{shootingTime}}，修图 {{retouchingTime}}，合计 {{totalTime}}<br>
        申报原由：<span style="white-space:pre-wrap;">{{reason}}</span><br>
        申报 IP：{{submitIp}}<br>
        浏览器 User-Agent：{{userAgent}}</p>
      <p style="margin-bottom:0;color:#925100;"><strong>如果这不是你本人申报的，请及时联系部长核对。</strong></p>
    </div>
  </td>
</tr>
