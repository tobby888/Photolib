<tr>
  <td style="background:#fff;border:1px solid #e3e9f0;border-radius:14px;overflow:hidden;">
    <div style="padding:22px 28px;background:#4682B4;color:#fff;font-size:22px;font-weight:700;">工时审核通过</div>
    <div style="padding:24px 28px;font-size:14px;line-height:1.8;overflow-wrap:anywhere;word-break:break-word;">
      <p style="margin:0 0 12px;">{{recipientName}}，你好！以你的姓名通过上传链接申报的以下工时已审核通过。</p>
      <p>选题项目：{{projectTitle}}<br>
        工作日期：{{workDate}}<br>
        确认时长：拍摄 {{shootingTime}}，修图 {{retouchingTime}}，合计 {{totalTime}}<br>
        申报原由：<span style="white-space:pre-wrap;">{{reason}}</span><br>
        审核人：{{reviewerName}}</p>
      <p style="margin-bottom:0;">如果对这条记录有疑问，请及时联系部长核对。</p>
    </div>
  </td>
</tr>
