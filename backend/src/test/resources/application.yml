spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:photolib;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  sql:
    init:
      mode: never

photolib:
  backup:
    # 共享测试上下文里关掉每日备份，避免测试恰好跑到零点时被调度任务写脏数据。
    enabled: false
  featured:
    # 同上：关掉好图精选的到期自动截止定时任务。
    deadline-enabled: false
  message-image-cleanup:
    # 同上：关掉孤儿消息图片清理，用例自己直接调 cleanup()。
    enabled: false
  photo:
    missing-upload-scan:
      # 同上：关掉「卡在上传中」的定时扫描。共享的测试上下文里跑一整轮会软删掉别的
      # 测试类刚造出来的 UPLOADING 夹具；用例自己直接调 scan()。
      enabled: false
    failed-upload-retention:
      # 同上：关掉处理失败上传的保留期清理，用例自己直接调 cleanup()。
      enabled: false
    stalled-processing:
      # 同上：关掉卡在处理中的恢复任务。共享上下文里的其他测试会造 PROCESSING 夹具
      # 并直接调 submit()；用例自己直接调 recover()。
      enabled: false
  photo-processing:
    threads: 2
    temporary-directory: ${java.io.tmpdir}/photolib-test-photo-processing
  auth:
    access-ttl: 15m
    idle-ttl: 30m
    secure-cookie: false
    mfa:
      encryption-key: dGVzdC1vbmx5LW1mYS1lbmNyeXB0aW9uLWtleS0zMmI=
  bootstrap:
    enabled: false
    admin-password: TestPassword123!
  storage:
    mode: local
    local-directory: ${java.io.tmpdir}/photolib-test-storage
    public-base-url: http://localhost:8080/api/v1/local-storage/objects
    signing-secret: photolib-test-signing-secret-32chars-min
    upload-url-ttl: 15m
    download-url-ttl: 15m
    original-retention: 30d
    image-target-bytes: 10485760
    image-max-bytes: 104857600
    preview-compression-ratio: 0.6
