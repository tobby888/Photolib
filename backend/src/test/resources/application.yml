spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:photolib;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  sql:
    init:
      mode: never

photolib:
  backup:
    # 共享测试上下文里关掉每日备份，避免测试恰好跑到零点时被调度任务写脏数据。
    enabled: false
  photo-processing:
    threads: 2
    temporary-directory: ${java.io.tmpdir}/photolib-test-photo-processing
  auth:
    access-ttl: 15m
    idle-ttl: 30m
    secure-cookie: false
  bootstrap:
    enabled: false
    admin-password: TestPassword123!
  storage:
    mode: local
    local-directory: ${java.io.tmpdir}/photolib-test-storage
    public-base-url: http://localhost:8080/api/v1/local-storage/objects
    signing-secret: photolib-test-signing-secret-32chars-min
    upload-url-ttl: 15m
    download-url-ttl: 15m
    original-retention: 30d
    image-target-bytes: 10485760
    image-max-bytes: 104857600
    preview-compression-ratio: 0.6
